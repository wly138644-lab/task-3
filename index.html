<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام إدارة النتائج</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="text-center mb-4">
      <h1 class="h2 fw-bold">نظام إدارة النتائج</h1>
      <p class="text-secondary mb-0">أضف الطلاب ثم فعّل لجنة الرأفة لمعالجة المتعثرين</p>
    </header>

    <div class="row g-4">
      <!-- نموذج الإدخال -->
      <section class="col-lg-5">
        <div class="card shadow-sm">
          <div class="card-header fw-semibold">بيانات الطالب</div>
          <div class="card-body">
            <div class="mb-3">
              <label for="studentName" class="form-label">اسم الطالب</label>
              <input type="text" id="studentName" class="form-control" placeholder="مثال: أحمد محمد">
            </div>
            <div class="row g-2 mb-3">
              <div class="col-12 col-sm-4">
                <label for="grade1" class="form-label">المادة 1</label>
                <input type="number" id="grade1" class="form-control" min="0" max="100" placeholder="0 - 100">
              </div>
              <div class="col-12 col-sm-4">
                <label for="grade2" class="form-label">المادة 2</label>
                <input type="number" id="grade2" class="form-control" min="0" max="100" placeholder="0 - 100">
              </div>
              <div class="col-12 col-sm-4">
                <label for="grade3" class="form-label">المادة 3</label>
                <input type="number" id="grade3" class="form-control" min="0" max="100" placeholder="0 - 100">
              </div>
            </div>
            <div class="mb-4">
              <label for="attendance" class="form-label">نسبة الحضور (%)</label>
              <input type="number" id="attendance" class="form-control" min="0" max="100" placeholder="0 - 100">
            </div>

            <div id="errorBox" class="alert alert-danger d-none" role="alert" aria-live="polite"></div>

            <div class="d-grid gap-2">
              <button type="button" id="addBtn" class="btn btn-primary">إضافة طالب</button>
              <button type="button" id="committeeBtn" class="btn btn-warning">تفعيل لجنة الرأفة</button>
            </div>
          </div>
        </div>
      </section>

      <!-- مناطق العرض -->
      <section class="col-lg-7">
        <div class="card shadow-sm mb-4">
          <div class="card-header fw-semibold">الطلاب المضافون</div>
          <div class="card-body">
            <div id="studentsBox"><p class="text-secondary mb-0">لم تتم إضافة أي طالب بعد.</p></div>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-header fw-semibold">التقرير النهائي للجنة الرأفة</div>
          <div class="card-body">
            <div id="reportBox"><p class="text-secondary mb-0">اضغط "تفعيل لجنة الرأفة" لعرض التقرير.</p></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
